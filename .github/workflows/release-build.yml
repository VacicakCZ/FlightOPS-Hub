name: Build and attach release exe

# Fires when a release is published on GitHub (the same manual "Draft a new
# release" -> write notes -> Publish flow already in use) - not on every tag
# push, so release notes stay a deliberate, human-written step; this workflow
# only adds the build+attach that used to be done by hand afterward.
on:
  release:
    types: [published]

permissions:
  contents: write # needed to upload a release asset

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller==6.22.2

      - name: Build exe
        run: python -m PyInstaller flightops_hub.spec --noconfirm

      - name: Attach exe to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/flightops_hub.exe --clobber
