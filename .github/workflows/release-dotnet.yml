name: Release (.NET installer)

# Builds the .NET app (framework-dependent - the installer itself detects
# and downloads the .NET Desktop Runtime if it's missing, see
# installer/flightops_hub.iss's [Code] section) and packages it into a
# per-user Inno Setup installer, then attaches it to the GitHub Release
# for the pushed tag. Replaces the old PyInstaller-based
# release-build.yml - v3.0.0 onward ships as this installer, not a
# portable .exe (see the .NET rewrite plan/memory for why: first-party
# NotifyIcon tray support instead of the third-party pystray that crashed
# on the second minimize/restore cycle).
#
# windows-latest, not ubuntu - this builds and packages a Windows WPF app.
#
# Triggered by pushing a tag like v3.0.0 (the leading "v" is stripped for
# both the installer's AppVersion and the release asset filename).
# workflow_dispatch lets you build+upload the installer as a plain
# artifact without cutting a release, useful for testing this workflow
# itself.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp the installer with (no leading v), e.g. 3.0.0"
        required: true
        default: "0.0.0-manual"

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run .NET tests
        run: dotnet test dotnet/FlightOpsHub.sln

      - name: Publish framework-dependent app
        run: >
          dotnet publish dotnet/src/FlightOpsHub.App/FlightOpsHub.App.csproj
          -c Release -r win-x64 --self-contained false
          -o dotnet/publish

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.version.outputs.version }}" `
            dotnet\installer\flightops_hub.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlightOpsHub-Setup-${{ steps.version.outputs.version }}
          path: dotnet/installer/Output/*.exe

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dotnet/installer/Output/*.exe
