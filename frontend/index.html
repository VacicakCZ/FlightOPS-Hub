<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FlightOps Hub</title>
  <link rel="stylesheet" href="vendor/leaflet.css" />
  <link rel="stylesheet" href="css/base.css" />
</head>
<body>
  <div id="app" x-data x-init="window.AppReady = $store.app.init()">
    <div class="brand-bar">
      <div class="brand-mark"><img src="img/app-icon.png" alt="" /></div>
      <div class="brand-name"><span class="brand-name-main">FlightOps</span><span class="brand-name-sub">Hub</span></div>
    </div>

    <button type="button" class="global-update-banner" x-show="$store.app.updateInfo" x-cloak @click="$store.app.goToUpdate()">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      <span x-text="$store.app.t('update_available_banner', $store.app.updateInfo ? $store.app.updateInfo.version : '')"></span>
    </button>

    <div class="app-body">
      <nav class="side-nav">
        <button class="side-nav-item" :class="{ active: $store.app.activeTab === 'flight' }" @click="$store.app.setTab('flight')">
          <span class="side-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg></span>
          <span class="side-nav-main" x-text="$store.app.tMain('tab_let')"></span>
          <span class="side-nav-sub" x-show="$store.app.tParen('tab_let')" x-text="$store.app.tParen('tab_let')"></span>
        </button>
        <button class="side-nav-item" :class="{ active: $store.app.activeTab === 'autostart' }" @click="$store.app.setTab('autostart')">
          <span class="side-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg></span>
          <span class="side-nav-main" x-text="$store.app.tMain('tab_exe')"></span>
          <span class="side-nav-sub" x-show="$store.app.tParen('tab_exe')" x-text="$store.app.tParen('tab_exe')"></span>
        </button>
        <button class="side-nav-item" :class="{ active: $store.app.activeTab === 'scenery' }" @click="$store.app.setTab('scenery')">
          <span class="side-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon><line x1="9" y1="3" x2="9" y2="18"></line><line x1="15" y1="6" x2="15" y2="21"></line></svg></span>
          <span class="side-nav-main" x-text="$store.app.tMain('tab_scenery')"></span>
          <span class="side-nav-sub" x-show="$store.app.tParen('tab_scenery')" x-text="$store.app.tParen('tab_scenery')"></span>
        </button>
        <button class="side-nav-item" :class="{ active: $store.app.activeTab === 'aircraft' }" @click="$store.app.setTab('aircraft')">
          <span class="side-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v7"></path><path d="M4 13l8-2 8 2"></path><path d="M12 9v9"></path><path d="M8 21l4-2 4 2"></path></svg></span>
          <span class="side-nav-main" x-text="$store.app.tMain('tab_aircraft')"></span>
          <span class="side-nav-sub" x-show="$store.app.tParen('tab_aircraft')" x-text="$store.app.tParen('tab_aircraft')"></span>
        </button>
        <button class="side-nav-item" :class="{ active: $store.app.activeTab === 'settings' }" @click="$store.app.setTab('settings')">
          <span class="side-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"></circle><circle cx="12" cy="12" r="7"></circle><rect x="10.6" y="1.5" width="2.8" height="3.4" rx="1" fill="currentColor" stroke="none"></rect><rect x="10.6" y="1.5" width="2.8" height="3.4" rx="1" fill="currentColor" stroke="none" transform="rotate(45 12 12)"></rect><rect x="10.6" y="1.5" width="2.8" height="3.4" rx="1" fill="currentColor" stroke="none" transform="rotate(90 12 12)"></rect><rect x="10.6" y="1.5" width="2.8" height="3.4" rx="1" fill="currentColor" stroke="none" transform="rotate(135 12 12)"></rect><rect x="10.6" y="1.5" width="2.8" height="3.4" rx="1" fill="currentColor" stroke="none" transform="rotate(180 12 12)"></rect><rect x="10.6" y="1.5" width="2.8" height="3.4" rx="1" fill="currentColor" stroke="none" transform="rotate(225 12 12)"></rect><rect x="10.6" y="1.5" width="2.8" height="3.4" rx="1" fill="currentColor" stroke="none" transform="rotate(270 12 12)"></rect><rect x="10.6" y="1.5" width="2.8" height="3.4" rx="1" fill="currentColor" stroke="none" transform="rotate(315 12 12)"></rect></svg></span>
          <span class="side-nav-main" x-text="$store.app.tMain('tab_set')"></span>
          <span class="side-nav-sub" x-show="$store.app.tParen('tab_set')" x-text="$store.app.tParen('tab_set')"></span>
        </button>
        <div class="side-nav-footer" x-text="$store.app.version"></div>
      </nav>

      <div class="tab-panels">
      <section x-show="$store.app.activeTab === 'flight'" x-data="flightTab">
        <div class="onboarding-panel" x-show="showOnboarding" x-cloak>
          <h3 x-text="$store.app.t('onboarding_title')"></h3>
          <p class="hint" x-text="$store.app.t('onboarding_intro')"></p>

          <div class="field-row">
            <label x-text="$store.app.t('set_nav_title')"></label>
            <div class="path-row">
              <input type="text" readonly :value="$store.app.config._community_path || ''" :placeholder="$store.app.t('set_nav_placeholder')" />
              <button class="btn" @click="onboardingBrowseCommunity()" x-text="$store.app.t('btn_browse')"></button>
            </div>
            <button type="button" class="btn detected-path-btn" x-show="communityPathSuggestion" x-cloak
                    @click="onboardingUseDetectedCommunityPath()"
                    x-text="$store.app.t('community_path_detected', communityPathSuggestion)"></button>
          </div>

          <div class="field-row">
            <label x-text="$store.app.t('gsx_path_title')"></label>
            <div class="path-row">
              <input type="text" readonly :value="$store.app.config._gsx_profiles_path_effective || ''" :placeholder="$store.app.t('gsx_path_placeholder')" />
              <button class="btn" @click="onboardingBrowseGsx()" x-text="$store.app.t('btn_browse')"></button>
            </div>
          </div>

          <div class="field-row">
            <label x-text="$store.app.t('simbrief_username_label')"></label>
            <input type="text" :value="$store.app.config._simbrief_username || ''" @change="onboardingSaveSimbrief($event.target.value)" placeholder="Navigraph Alias / SimBrief username" />
          </div>

          <p class="hint" x-text="$store.app.t('onboarding_optional_hint')"></p>

          <button type="button" class="btn primary" @click="dismissOnboarding()"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> <span x-text="$store.app.t('onboarding_dismiss')"></span></button>
        </div>

        <h2 x-text="$store.app.t('main_title')"></h2>

        <div class="field-row inline">
          <label x-text="$store.app.t('profile_label')"></label>
          <select @change="onProfileChange($event.target.value)">
            <option value="" :selected="!profileName" x-text="$store.app.t('default_profile')"></option>
            <template x-for="name in profileNames" :key="name">
              <option :value="name" :selected="name === profileName" x-text="name"></option>
            </template>
          </select>
          <button class="btn" @click="updateProfile()" :disabled="!profileName" :title="$store.app.t('tt_update')" x-html="updateJustSaved ? `<svg class='icon' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.75' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'></polyline></svg>` : `<svg class='icon' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.75' stroke-linecap='round' stroke-linejoin='round'><polyline points='23 4 23 10 17 10'></polyline><polyline points='1 20 1 14 7 14'></polyline><path d='M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15'></path></svg>`"></button>
          <button class="btn" @click="saveProfileAs()" :title="$store.app.t('tt_add')"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
          <button class="btn" @click="deleteProfile()" :disabled="!profileName" :title="$store.app.t('tt_delete')"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg></button>
        </div>

        <p class="airac-status" :class="airacStatusClass">
          <svg x-show="airacStatusClass === 'airac-ok'" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          <svg x-show="airacStatusClass === 'airac-old'" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
          <span x-text="airacStatusText"></span>
        </p>

        <div class="app-checklist">
          <template x-for="name in appNames" :key="name">
            <label class="app-checkbox-row">
              <input type="checkbox" x-model="checked[name]" />
              <span x-text="name"></span>
            </label>
          </template>
        </div>

        <button class="btn primary btn-launch" :disabled="launching" @click="launchAll()"
                x-text="launching ? $store.app.t('btn_launching') : $store.app.t('btn_launch')"></button>
      </section>

      <section x-show="$store.app.activeTab === 'autostart'" x-data="autostartTab">
        <h2 x-text="$store.app.t('exe_title')"></h2>

        <div class="field-row inline">
          <label x-text="$store.app.t('exe_profile_label')"></label>
          <select @change="onProfileChange($event.target.value)">
            <option value="" :selected="!profileName" x-text="$store.app.t('default_profile')"></option>
            <template x-for="name in profileNames" :key="name">
              <option :value="name" :selected="name === profileName" x-text="name"></option>
            </template>
          </select>
          <button class="btn" @click="updateProfile()" :disabled="!profileName" :title="$store.app.t('tt_update')" x-html="updateJustSaved ? `<svg class='icon' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.75' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'></polyline></svg>` : `<svg class='icon' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.75' stroke-linecap='round' stroke-linejoin='round'><polyline points='23 4 23 10 17 10'></polyline><polyline points='1 20 1 14 7 14'></polyline><path d='M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15'></path></svg>`"></button>
          <button class="btn" @click="saveProfileAs()" :title="$store.app.t('tt_add')"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
          <button class="btn" @click="deleteProfile()" :disabled="!profileName" :title="$store.app.t('tt_delete')"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg></button>
        </div>

        <p class="hint" x-text="path"></p>
        <p class="hint"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"></path><path d="M10 22h4"></path><path d="M12 2a7 7 0 0 0-4 12.72c.6.53 1 1.28 1 2.28h6c0-1 .4-1.75 1-2.28A7 7 0 0 0 12 2z"></path></svg> <span x-text="$store.app.t('exe_rename_hint')"></span></p>

        <button type="button" class="btn" x-show="hasBackup" @click="restoreBackup()" x-text="$store.app.t('exe_restore_btn')"></button>

        <template x-if="!exists">
          <p class="error-text" x-text="$store.app.t('exe_not_found')"></p>
        </template>

        <template x-if="exists && error">
          <p class="error-text" x-text="`${$store.app.t('exe_error')} ${error}`"></p>
        </template>

        <template x-if="exists && !error">
          <div>
            <div class="scenery-search">
              <input type="text" class="scenery-search-input" x-model="searchQuery"
                     :placeholder="$store.app.t('autostart_search_placeholder')" />
              <button class="btn icon-btn" x-show="searchQuery" @click="searchQuery = ''"
                      :title="$store.app.t('scenery_search_clear')"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
            </div>

            <p class="placeholder-note" x-show="searchQuery.trim() && filteredAddons.length === 0"
               x-text="$store.app.t('autostart_search_no_results')"></p>

            <div class="app-checklist">
              <template x-for="addon in filteredAddons" :key="addon.unique_key">
                <div class="exe-row">
                  <label class="exe-row-label">
                    <input type="checkbox" :checked="addon.enabled" @change="toggle(addon)" />
                    <span x-text="addon.display_name"></span>
                  </label>
                  <button class="btn" @click="rename(addon)" :title="$store.app.t('exe_rename_tt')"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg></button>
                </div>
              </template>
            </div>
          </div>
        </template>
      </section>

      <section x-show="$store.app.activeTab === 'scenery'" x-data="sceneryTab">
        <h2 x-text="$store.app.t('tab_scenery').trim()"></h2>

        <template x-if="applying && !dataLoaded">
          <div>
            <p class="placeholder-note" x-text="$store.app.t('addon_apply_busy')"></p>
            <p class="hint" x-show="statusText" x-text="statusText"></p>
            <div class="progress-track">
              <div class="progress-fill" :style="`width: ${progressFraction * 100}%`"></div>
            </div>
          </div>
        </template>

        <template x-if="(!applying || dataLoaded) && noCommunity">
          <p class="placeholder-note" x-text="$store.app.t('scenery_no_community')"></p>
        </template>

        <template x-if="(!applying || dataLoaded) && !noCommunity">
          <div>
            <div class="toolbar">
              <button class="btn" :disabled="applying" @click="setAll(true)" x-text="$store.app.t('scenery_select_all_on')"></button>
              <button class="btn" :disabled="applying" @click="setAll(false)" x-text="$store.app.t('scenery_select_all_off')"></button>
              <button class="btn" :disabled="applying" @click="refresh()" x-text="$store.app.t('scenery_refresh_btn')"></button>
              <button class="btn primary" :disabled="applying" @click="apply()" x-text="$store.app.t('scenery_apply_btn')"></button>
            </div>

            <p class="hint"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"></path><path d="M10 22h4"></path><path d="M12 2a7 7 0 0 0-4 12.72c.6.53 1 1.28 1 2.28h6c0-1 .4-1.75 1-2.28A7 7 0 0 0 12 2z"></path></svg> <span x-text="$store.app.t('scenery_apply_pending_hint')"></span></p>

            <div class="view-toggle">
              <button class="view-toggle-btn" :class="{ active: !mapView }" :disabled="applying" @click="showListView()">
                <span class="view-toggle-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></span>
                <span x-text="$store.app.t('scenery_view_list_btn')"></span>
              </button>
              <button class="view-toggle-btn" :class="{ active: mapView }" :disabled="applying" @click="showMapView()">
                <span class="view-toggle-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line></svg></span>
                <span x-text="$store.app.t('scenery_view_map_btn')"></span>
              </button>
            </div>

            <div class="gsx-legend">
              <span class="gsx-legend-item"><span class="gsx-tag gsx-match">GSX</span> <span x-text="$store.app.t('gsx_legend_match')"></span></span>
              <span class="gsx-legend-item"><span class="gsx-tag gsx-unmatched">GSX</span> <span x-text="$store.app.t('gsx_legend_unmatched')"></span></span>
              <span class="gsx-legend-item"><span class="gsx-tag gsx-missing">GSX</span> <span x-text="$store.app.t('gsx_legend_missing')"></span></span>
            </div>

            <div class="warning-panel" x-show="!mapView && conflicts.length" x-cloak>
              <p class="warning-text"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg> <span x-text="$store.app.t('scenery_conflict_hint')"></span></p>
              <template x-for="c in conflicts" :key="c.icao">
                <p class="hint">
                  <strong x-text="c.icao"></strong>: <span x-text="c.records.map(r => r.display_name).join(', ')"></span>
                </p>
              </template>
            </div>

            <div class="simbrief-panel">
              <button class="btn" :disabled="!simbriefUsernameSet || simbriefChecking || applying"
                      @click="checkSimbrief()"
                      x-text="simbriefChecking ? $store.app.t('simbrief_checking') : $store.app.t('simbrief_check_btn')"></button>
              <p class="hint" x-show="!simbriefUsernameSet" x-text="$store.app.t('simbrief_no_username')"></p>
              <p class="error-text" x-show="simbriefError" x-text="$store.app.t(simbriefError)"></p>

              <div class="simbrief-summary" x-show="simbriefSummary" x-cloak>
                <span class="hint" x-show="simbriefSummary && simbriefSummary.aircraft_name" x-text="$store.app.t('simbrief_summary_aircraft', simbriefSummary.aircraft_name)"></span>
                <span class="hint" x-show="simbriefSummary && simbriefSummary.duration_minutes != null" x-text="$store.app.t('simbrief_summary_duration', formatDuration(simbriefSummary.duration_minutes))"></span>
                <span class="hint" x-show="simbriefSummary && simbriefSummary.planned_at != null" x-text="$store.app.t('simbrief_summary_planned', formatPlannedAt(simbriefSummary.planned_at))"></span>
                <span class="airac-mismatch-badge" x-show="airacMismatch" x-cloak
                      :title="simbriefSummary ? $store.app.t('simbrief_airac_mismatch', simbriefSummary.simbrief_airac, simbriefSummary.installed_airac) : ''"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg> AIRAC</span>
              </div>

              <template x-if="simbriefLegs.length">
                <div class="simbrief-legs">
                  <template x-for="leg in simbriefLegs" :key="leg.role">
                    <div>
                      <div class="simbrief-leg">
                        <span class="simbrief-role" x-text="$store.app.t('simbrief_role_' + leg.role)"></span>
                        <span class="simbrief-icao" x-text="leg.icao"></span>
                        <span class="simbrief-status" :class="'status-' + leg.status" x-text="$store.app.t('simbrief_status_' + leg.status)"></span>
                        <button class="btn simbrief-enable-btn"
                                :style="leg.status === 'disabled' ? '' : 'visibility:hidden'"
                                :disabled="applying || leg.status !== 'disabled'"
                                @click="quickEnable(leg.folder_name)" x-text="$store.app.t('simbrief_enable_btn')"></button>
                        <span class="gsx-tag gsx-match" x-show="leg.gsx_status === 'installed_match'"
                              :title="$store.app.t('scenery_gsx_match_tt')">GSX</span>
                        <span class="gsx-tag gsx-unmatched" x-show="leg.gsx_status === 'installed_unmatched'"
                              :title="$store.app.t('scenery_gsx_unmatched_tt')">GSX</span>
                        <button type="button" class="gsx-tag gsx-missing" x-show="leg.gsx_status === 'missing'"
                                @click.stop.prevent="openGsxSearch(leg.icao)"

                                      </div>
                                      <div class="override-field">
                                        <label x-text="$store.app.t('aircraft_override_parent_label')"></label>
                                        <select @change="setParentOverride(record, $event.target.value)">
                                          <option value="auto" :selected="effectiveParentOverride(record.folder_name) === 'auto'" x-text="$store.app.t('aircraft_override_parent_auto')"></option>
                                          <option value="" :selected="effectiveParentOverride(record.folder_name) === ''" x-text="$store.app.t('aircraft_override_parent_none')"></option>

                        </div>
                      </template>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </div>

        </div>

        <div class="field-row">
          <label x-text="$store.app.t('sim_label')"></label>

              <option value="MSFS 2024" :selected="simVersion === 'MSFS 2024'">MSFS 2024</option>

            </select>
          </div>

        <h3 x-text="$store.app.t('exe_xml_path_title')"></h3>

          <input type="text" readonly :value="exeXmlPath" :placeholder="$store.app.t('exe_xml_path_placeholder')" />
          <button class="btn" @click="browseExeXmlPath()" x-text="$store.app.t('btn_browse')"></button>
          <button class="btn" @click="resetExeXmlPath()" x-text="$store.app.t('exe_xml_path_reset_btn')"></button>
        </div>

        <div class="field-row">
          <label x-text="$store.app.t('post_launch_label')"></label>
          <select @change="savePostLaunch($event.target.value)">
            <option value="exit" :selected="postLaunch === 'exit'" x-text="$store.app.t('post_launch_exit')"></option>
            <option value="stay_and_watch" :selected="postLaunch === 'stay_and_watch'" x-text="$store.app.t('post_launch_watch')"></option>
          </select>
        </div>

        <div class="field-row">
          <label>
            <input type="checkbox" :checked="launchAtStartup" @change="toggleLaunchAtStartup($event.target.checked)" />
            <span x-text="$store.app.t('launch_at_startup_label')"></span>
          </label>
        </div>

        <hr />

        <h3 x-text="$store.app.t('set_nav_title')"></h3>
        <p class="hint" x-text="$store.app.t('set_nav_hint')"></p>

        </div>
        <div class="detected-path-row" x-show="communityPathSuggestion" x-cloak>
          <button type="button" class="btn detected-path-btn"
                  @click="useDetectedCommunityPath()"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"></path><path d="M10 22h4"></path><path d="M12 2a7 7 0 0 0-4 12.72c.6.53 1 1.28 1 2.28h6c0-1 .4-1.75 1-2.28A7 7 0 0 0 12 2z"></path></svg> <span x-text="$store.app.t('community_path_detected', communityPathSuggestion)"></span></button>
          <button type="button" class="btn icon-btn" @click="dismissCommunityPathSuggestion()"
                  :title="$store.app.t('community_path_detected_dismiss_tt')"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>

        <template x-for="entry in lowDiskSpaceEntries" :key="entry.label">
          <p class="warning-text"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg> <span x-text="$store.app.t('low_disk_space_' + entry.label, formatBytes(entry.free_bytes))"></span></p>
        </template>

        <button type="button" class="btn" :disabled="!communityPath || folderUsageScanning.community"
                @click="scanCommunityUsage()"
                x-text="folderUsageScanning.community ? $store.app.t('folder_usage_scanning') : $store.app.t('community_usage_btn')"></button>

        <div class="community-usage" x-show="folderUsage.community" x-cloak>
          <div class="community-usage-head">
            <p class="hint" x-text="$store.app.t('folder_usage_total', formatBytes(folderUsage.community ? folderUsage.community.total_bytes : 0))"></p>
            <button type="button" class="btn icon-btn" @click="closeUsage('community')" :title="$store.app.t('usage_close')"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
          </div>
          <template x-for="pkg in topPackages('community')" :key="pkg.folder_name">
            <div class="community-usage-row">
              <span class="community-usage-name" x-text="pkg.folder_name"></span>
              <span class="community-usage-size" x-text="formatBytes(pkg.bytes)"></span>
            </div>
          </template>
        </div>

        <h3 x-text="$store.app.t('disabled_path_title')"></h3>
        <p class="hint" x-text="$store.app.t('disabled_path_hint')"></p>
        <div class="path-row">
          <input type="text" readonly :value="disabledPath" :placeholder="$store.app.t('disabled_path_placeholder')" />
          <button class="btn" @click="browseDisabledPath()" x-text="$store.app.t('btn_browse')"></button>
          <button class="btn" @click="resetDisabledPath()" x-text="$store.app.t('disabled_path_reset_btn')"></button>
        </div>

        <button type="button" class="btn" :disabled="!communityPath || folderUsageScanning.disabled"
                @click="scanDisabledUsage()"
                x-text="folderUsageScanning.disabled ? $store.app.t('folder_usage_scanning') : $store.app.t('disabled_usage_btn')"></button>

        <div class="community-usage" x-show="folderUsage.disabled" x-cloak>
          <div class="community-usage-head">
            <p class="hint" x-text="$store.app.t('folder_usage_total', formatBytes(folderUsage.disabled ? folderUsage.disabled.total_bytes : 0))"></p>
            <button type="button" class="btn icon-btn" @click="closeUsage('disabled')" :title="$store.app.t('usage_close')"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
          </div>
          <template x-for="pkg in topPackages('disabled')" :key="pkg.folder_name">
            <div class="community-usage-row">
              <span class="community-usage-name" x-text="pkg.folder_name"></span>
              <span class="community-usage-size" x-text="formatBytes(pkg.bytes)"></span>
            </div>
          </template>
        </div>

        <button type="button" class="btn" :disabled="!communityPath || diagnosticsScanning"
                @click="scanCommunityDiagnostics()"

        <div class="community-usage" x-show="diagnostics" x-cloak>
          <div class="community-usage-head">
            <p class="hint">
              <svg x-show="diagnosticsHasIssues" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
              <svg x-show="!diagnosticsHasIssues" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
              <span x-text="diagnosticsHasIssues ? $store.app.t('diagnostics_issues_found') : $store.app.t('diagnostics_none_found')"></span>
            </p>
            <button type="button" class="btn icon-btn" @click="closeDiagnostics()" :title="$store.app.t('usage_close')"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
          </div>

          <template x-if="diagnostics && diagnostics.misplaced.length > 0">
            <div>
              <p class="hint" x-text="$store.app.t('diagnostics_misplaced_hint')"></p>
              <template x-for="item in (diagnostics ? diagnostics.misplaced : [])" :key="item.folder_name">
                <div class="community-usage-row">
                  <span class="community-usage-name" x-text="item.folder_name + ' / ' + item.nested_folder"></span>
                </div>
              </template>
            </div>
          </template>

          <template x-if="diagnostics && diagnostics.duplicates.length > 0">
            <div>
              <p class="hint" x-text="$store.app.t('diagnostics_duplicates_hint')"></p>
              <p class="hint diagnostics-caveat" x-text="$store.app.t('diagnostics_duplicates_caveat')"></p>
              <template x-for="item in (diagnostics ? diagnostics.duplicates : [])" :key="item.title">
                <div class="community-usage-row">
                  <span class="community-usage-name" x-text="item.title + ': ' + item.folders.join(', ')"></span>
                </div>
              </template>
            </div>
          </template>

          <input type="text" :value="simbriefUsername" @change="saveSimbriefUsername($event.target.value)" placeholder="Navigraph Alias / SimBrief username" />
        </div>

        <h3 x-text="$store.app.t('atc_network_title')"></h3>
        <p class="hint" x-text="$store.app.t('atc_network_hint')"></p>

          <select :value="atcNetwork" @change="saveAtcNetwork($event.target.value)">
            <option value="off" x-text="$store.app.t('atc_network_off')"></option>
            <option value="vatsim" x-text="$store.app.t('atc_network_vatsim')"></option>
            <option value="ivao" x-text="$store.app.t('atc_network_ivao')"></option>
          </select>
        </div>

        <h3 x-text="$store.app.t('gsx_path_title')"></h3>
        <p class="hint" x-text="$store.app.t('gsx_path_hint')"></p>

          <input type="text" readonly :value="gsxPath" :placeholder="$store.app.t('gsx_path_placeholder')" />
          <button class="btn" @click="browseGsxPath()" x-text="$store.app.t('btn_browse')"></button>
          <button class="btn" @click="resetGsxPath()" x-text="$store.app.t('gsx_path_reset_btn')"></button>
        </div>

          <input type="text" x-model="form.name" :placeholder="$store.app.t('add_name_placeholder')" />

        <div class="path-row">
          <input type="text" x-model="form.path" :placeholder="$store.app.t('add_path_placeholder')" />

          <label x-text="$store.app.t('mode_label')"></label>
          <select x-model="form.launchMode">

          <template x-if="form.launchMode === 'timer'">

              <input type="number" min="1" x-model.number="form.delay" style="width:60px" />

            </span>
          </template>
        </div>
        <div class="field-row inline">
          <label><input type="checkbox" x-model="form.admin" /> <span x-text="$store.app.t('run_admin_label')"></span></label>

        <p class="error-text" x-show="errorKey" x-text="$store.app.t(errorKey)"></p>

              <span class="app-row-label" x-text="appRowLabel(name, data)"></span>

                <button class="btn" @click="startEdit(name)" x-text="$store.app.t('btn_edit')"></button>
                <button class="btn danger" @click="removeApp(name)" x-text="$store.app.t('btn_remove')"></button>
              </span>
            </div>
          </template>
        </div>

        <hr />

        </div>
        <p class="hint" x-show="configExportMessage" x-text="configExportMessage"></p>

        <p class="hint" x-text="$store.app.t('diagnostics_export_hint')"></p>
        <button class="btn" @click="exportDiagnostics()" x-text="$store.app.t('diagnostics_export_btn')"></button>
        <p class="hint" x-show="diagnosticsExportMessage" x-text="diagnosticsExportMessage"></p>

        <button type="button" class="version-footer" @click="$store.app.openReleasePage()"
                :title="$store.app.t('version_footer_tt')"
                x-text="`FlightOps Hub ${$store.app.version}`"></button>

        <div class="update-notice-wrap" x-show="$store.app.updateInfo" x-cloak>
          <button type="button" class="update-notice-toggle" @click="$store.app.updateNotesOpen = !$store.app.updateNotesOpen">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            <span x-text="$store.app.t('update_available', $store.app.updateInfo ? $store.app.updateInfo.version : '')"></span>
            <span x-text="$store.app.updateNotesOpen ? '▲' : '▼'"></span>
          </button>
          <div class="update-notes" x-show="$store.app.updateNotesOpen" x-cloak>
            <pre x-text="$store.app.updateInfo ? $store.app.updateInfo.notes : ''"></pre>

              <button type="button" class="btn primary" :disabled="$store.app.updateDownloading || $store.app.updateInstalling"
                      x-show="$store.app.updateInfo && $store.app.updateInfo.download_url"
                      @click="$store.app.updateNow()"
                      ><svg x-show="!$store.app.updateDownloading && !$store.app.updateInstalling" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> <span x-text="$store.app.updateInstalling ? $store.app.t('update_installing') : ($store.app.updateDownloading ? $store.app.t('update_downloading') : $store.app.t('update_install_btn'))"></span></button>
              <button type="button" class="btn" @click="$store.app.openUpdatePage()" x-text="$store.app.t('update_open_btn')"></button>
            </div>
            <div class="progress-track" x-show="$store.app.updateDownloading && $store.app.updateDownloadPercent != null">
              <div class="progress-fill" :style="`width: ${$store.app.updateDownloadPercent}%`"></div>
            </div>
            <p class="error-text" x-show="$store.app.updateDownloadError" x-text="$store.app.t('update_download_error', $store.app.updateDownloadError)"></p>
            <p class="error-text" x-show="$store.app.updateInstallError" x-text="$store.app.t('update_install_error', $store.app.updateInstallError)"></p>
          </div>
        </div>
      </section>
      </div>
    </div>

    <div class="modal-backdrop" x-show="$store.modal.visible" x-cloak>
      <div class="modal-box">
        <h3 x-text="$store.modal.title"></h3>
        <p x-text="$store.modal.message"></p>
        <input type="text" x-show="$store.modal.kind === 'prompt'" x-model="$store.modal.value" @keydown.enter="$store.modal.confirm()" />
        <div class="actions">
          <button class="btn" x-show="$store.modal.kind !== 'alert'" @click="$store.modal.cancel()" x-text="$store.app.t('modal_cancel')"></button>
          <button class="btn primary" @click="$store.modal.confirm()" x-text="$store.app.t('modal_ok')"></button>
        </div>
      </div>
    </div>
