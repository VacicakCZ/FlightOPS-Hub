<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FlightOps Hub</title>
  <link rel="stylesheet" href="vendor/leaflet.css" />
  <link rel="stylesheet" href="css/base.css" />
</head>
<body>
  <div id="app" x-data x-init="window.AppReady = $store.app.init()">
    <nav class="tab-bar">
      <button :class="{ active: $store.app.activeTab === 'flight' }" @click="$store.app.setTab('flight')">
        <span class="tab-icon">✈️</span>
        <span class="tab-main" x-text="$store.app.tMain('tab_let')"></span>
        <span class="tab-sub" x-show="$store.app.tParen('tab_let')" x-text="$store.app.tParen('tab_let')"></span>
      </button>
      <button :class="{ active: $store.app.activeTab === 'autostart' }" @click="$store.app.setTab('autostart')">
        <span class="tab-icon">⚡</span>
        <span class="tab-main" x-text="$store.app.tMain('tab_exe')"></span>
        <span class="tab-sub" x-show="$store.app.tParen('tab_exe')" x-text="$store.app.tParen('tab_exe')"></span>
      </button>
      <button :class="{ active: $store.app.activeTab === 'scenery' }" @click="$store.app.setTab('scenery')">
        <span class="tab-icon">🗺️</span>
        <span class="tab-main" x-text="$store.app.tMain('tab_scenery')"></span>
        <span class="tab-sub" x-show="$store.app.tParen('tab_scenery')" x-text="$store.app.tParen('tab_scenery')"></span>
      </button>
      <button :class="{ active: $store.app.activeTab === 'aircraft' }" @click="$store.app.setTab('aircraft')">
        <span class="tab-icon">🛫</span>
        <span class="tab-main" x-text="$store.app.tMain('tab_aircraft')"></span>
        <span class="tab-sub" x-show="$store.app.tParen('tab_aircraft')" x-text="$store.app.tParen('tab_aircraft')"></span>
      </button>
      <button :class="{ active: $store.app.activeTab === 'settings' }" @click="$store.app.setTab('settings')">
        <span class="tab-icon">⚙️</span>
        <span class="tab-main" x-text="$store.app.tMain('tab_set')"></span>
        <span class="tab-sub" x-show="$store.app.tParen('tab_set')" x-text="$store.app.tParen('tab_set')"></span>
      </button>
    </nav>

    <button type="button" class="global-update-banner" x-show="$store.app.updateInfo" x-cloak @click="$store.app.goToUpdate()"
            x-text="$store.app.t('update_available_banner', $store.app.updateInfo ? $store.app.updateInfo.version : '')"></button>

    <div class="tab-panels">
      <section x-show="$store.app.activeTab === 'flight'" x-data="flightTab">
        <div class="onboarding-panel" x-show="showOnboarding" x-cloak>
          <h3 x-text="$store.app.t('onboarding_title')"></h3>
          <p class="hint" x-text="$store.app.t('onboarding_intro')"></p>

          <div class="field-row">
            <label x-text="$store.app.t('set_nav_title')"></label>
            <div class="path-row">
              <input type="text" readonly :value="$store.app.config._community_path || ''" :placeholder="$store.app.t('set_nav_placeholder')" />
              <button class="btn" @click="onboardingBrowseCommunity()" x-text="$store.app.t('btn_browse')"></button>
            </div>
            <button type="button" class="btn detected-path-btn" x-show="communityPathSuggestion" x-cloak
                    @click="onboardingUseDetectedCommunityPath()"
                    x-text="$store.app.t('community_path_detected', communityPathSuggestion)"></button>
          </div>

          <div class="field-row">
            <label x-text="$store.app.t('gsx_path_title')"></label>
            <div class="path-row">
              <input type="text" readonly :value="$store.app.config._gsx_profiles_path_effective || ''" :placeholder="$store.app.t('gsx_path_placeholder')" />
              <button class="btn" @click="onboardingBrowseGsx()" x-text="$store.app.t('btn_browse')"></button>
            </div>
          </div>

          <div class="field-row">
            <label x-text="$store.app.t('simbrief_username_label')"></label>
            <input type="text" :value="$store.app.config._simbrief_username || ''" @change="onboardingSaveSimbrief($event.target.value)" placeholder="Navigraph Alias / SimBrief username" />
          </div>

          <p class="hint" x-text="$store.app.t('onboarding_optional_hint')"></p>

          <button type="button" class="btn primary" @click="dismissOnboarding()" x-text="$store.app.t('onboarding_dismiss')"></button>
        </div>

        <h2 x-text="$store.app.t('main_title')"></h2>

        <div class="field-row inline">
          <label x-text="$store.app.t('profile_label')"></label>
          <select @change="onProfileChange($event.target.value)">
            <option value="" :selected="!profileName" x-text="$store.app.t('default_profile')"></option>
            <template x-for="name in profileNames" :key="name">
              <option :value="name" :selected="name === profileName" x-text="name"></option>
            </template>
          </select>
          <button class="btn" @click="updateProfile()" :disabled="!profileName" :title="$store.app.t('tt_update')" x-text="updateJustSaved ? '✓' : '🔄'"></button>
          <button class="btn" @click="saveProfileAs()" :title="$store.app.t('tt_add')">➕</button>
          <button class="btn" @click="deleteProfile()" :disabled="!profileName" :title="$store.app.t('tt_delete')">🗑</button>
        </div>

        <p class="airac-status" :class="airacStatusClass" x-text="airacStatusText"></p>

        <div class="app-checklist">
          <template x-for="name in appNames" :key="name">
            <label class="app-checkbox-row">
              <input type="checkbox" x-model="checked[name]" />
              <span x-text="name"></span>
            </label>
          </template>
        </div>

        <button class="btn primary btn-launch" :disabled="launching" @click="launchAll()"
                x-text="launching ? $store.app.t('btn_launching') : $store.app.t('btn_launch')"></button>
      </section>

      <section x-show="$store.app.activeTab === 'autostart'" x-data="autostartTab">
        <h2 x-text="$store.app.t('exe_title')"></h2>

        <div class="field-row inline">
          <label x-text="$store.app.t('exe_profile_label')"></label>
          <select @change="onProfileChange($event.target.value)">
            <option value="" :selected="!profileName" x-text="$store.app.t('default_profile')"></option>
            <template x-for="name in profileNames" :key="name">
              <option :value="name" :selected="name === profileName" x-text="name"></option>
            </template>
          </select>
          <button class="btn" @click="updateProfile()" :disabled="!profileName" :title="$store.app.t('tt_update')" x-text="updateJustSaved ? '✓' : '🔄'"></button>
          <button class="btn" @click="saveProfileAs()" :title="$store.app.t('tt_add')">➕</button>
          <button class="btn" @click="deleteProfile()" :disabled="!profileName" :title="$store.app.t('tt_delete')">🗑</button>
        </div>

        <p class="hint" x-text="path"></p>
        <p class="hint" x-text="$store.app.t('exe_rename_hint')"></p>

        <button type="button" class="btn" x-show="hasBackup" @click="restoreBackup()" x-text="$store.app.t('exe_restore_btn')"></button>

        <template x-if="!exists">
          <p class="error-text" x-text="$store.app.t('exe_not_found')"></p>
        </template>

        <template x-if="exists && error">
          <p class="error-text" x-text="`${$store.app.t('exe_error')} ${error}`"></p>
        </template>

        <template x-if="exists && !error">
          <div>
            <div class="scenery-search">
              <input type="text" class="scenery-search-input" x-model="searchQuery"
                     :placeholder="$store.app.t('autostart_search_placeholder')" />
              <button class="btn icon-btn" x-show="searchQuery" @click="searchQuery = ''"
                      :title="$store.app.t('scenery_search_clear')">✕</button>
            </div>

            <p class="placeholder-note" x-show="searchQuery.trim() && filteredAddons.length === 0"
               x-text="$store.app.t('autostart_search_no_results')"></p>

            <div class="app-checklist">
              <template x-for="addon in filteredAddons" :key="addon.unique_key">
                <div class="exe-row">
                  <label class="exe-row-label">
                    <input type="checkbox" :checked="addon.enabled" @change="toggle(addon)" />
                    <span x-text="addon.display_name"></span>
                  </label>
                  <button class="btn" @click="rename(addon)" :title="$store.app.t('exe_rename_tt')">✏️</button>
                </div>
              </template>
            </div>
          </div>
        </template>
      </section>

      <section x-show="$store.app.activeTab === 'scenery'" x-data="sceneryTab">
        <h2 x-text="$store.app.t('tab_scenery').trim()"></h2>

        <template x-if="applying && !dataLoaded">
          <div>
            <p class="placeholder-note" x-text="$store.app.t('addon_apply_busy')"></p>
            <p class="hint" x-show="statusText" x-text="statusText"></p>
            <div class="progress-track">
              <div class="progress-fill" :style="`width: ${progressFraction * 100}%`"></div>
            </div>
          </div>
        </template>

        <template x-if="(!applying || dataLoaded) && noCommunity">
          <p class="placeholder-note" x-text="$store.app.t('scenery_no_community')"></p>
        </template>

        <template x-if="(!applying || dataLoaded) && !noCommunity">
          <div>
            <div class="toolbar">
              <button class="btn" :disabled="applying" @click="setAll(true)" x-text="$store.app.t('scenery_select_all_on')"></button>
              <button class="btn" :disabled="applying" @click="setAll(false)" x-text="$store.app.t('scenery_select_all_off')"></button>
              <button class="btn" :disabled="applying" @click="refresh()" x-text="$store.app.t('scenery_refresh_btn')"></button>
              <button class="btn primary" :disabled="applying" @click="apply()" x-text="$store.app.t('scenery_apply_btn')"></button>
            </div>

            <p class="hint" x-text="$store.app.t('scenery_apply_pending_hint')"></p>

            <div class="view-toggle">
              <button class="view-toggle-btn" :class="{ active: !mapView }" :disabled="applying" @click="showListView()">
                <span class="view-toggle-icon">☰</span>
                <span x-text="$store.app.t('scenery_view_list_btn')"></span>
              </button>
              <button class="view-toggle-btn" :class="{ active: mapView }" :disabled="applying" @click="showMapView()">
                <span class="view-toggle-icon">🗺</span>
                <span x-text="$store.app.t('scenery_view_map_btn')"></span>
              </button>
            </div>

            <div class="gsx-legend">
              <span class="gsx-legend-item"><span class="gsx-tag gsx-match">GSX</span> <span x-text="$store.app.t('gsx_legend_match')"></span></span>
              <span class="gsx-legend-item"><span class="gsx-tag gsx-unmatched">GSX</span> <span x-text="$store.app.t('gsx_legend_unmatched')"></span></span>
              <span class="gsx-legend-item"><span class="gsx-tag gsx-missing">GSX</span> <span x-text="$store.app.t('gsx_legend_missing')"></span></span>
            </div>

            <div class="warning-panel" x-show="!mapView && conflicts.length" x-cloak>
              <p class="warning-text" x-text="$store.app.t('scenery_conflict_hint')"></p>
              <template x-for="c in conflicts" :key="c.icao">
                <p class="hint">
                  <strong x-text="c.icao"></strong>: <span x-text="c.records.map(r => r.display_name).join(', ')"></span>
                </p>
              </template>
            </div>

            <div class="simbrief-panel">
              <button class="btn" :disabled="!simbriefUsernameSet || simbriefChecking || applying"
                      @click="checkSimbrief()"
                      x-text="simbriefChecking ? $store.app.t('simbrief_checking') : $store.app.t('simbrief_check_btn')"></button>
              <p class="hint" x-show="!simbriefUsernameSet" x-text="$store.app.t('simbrief_no_username')"></p>
              <p class="error-text" x-show="simbriefError" x-text="$store.app.t(simbriefError)"></p>

              <div class="simbrief-summary" x-show="simbriefSummary" x-cloak>
                <span class="hint" x-show="simbriefSummary && simbriefSummary.aircraft_name" x-text="$store.app.t('simbrief_summary_aircraft', simbriefSummary.aircraft_name)"></span>
                <span class="hint" x-show="simbriefSummary && simbriefSummary.duration_minutes != null" x-text="$store.app.t('simbrief_summary_duration', formatDuration(simbriefSummary.duration_minutes))"></span>
                <span class="hint" x-show="simbriefSummary && simbriefSummary.planned_at != null" x-text="$store.app.t('simbrief_summary_planned', formatPlannedAt(simbriefSummary.planned_at))"></span>
              </div>

              <template x-if="simbriefLegs.length">
                <div class="simbrief-legs">
                  <template x-for="leg in simbriefLegs" :key="leg.role">
                    <div class="simbrief-leg">
                      <span class="simbrief-role" x-text="$store.app.t('simbrief_role_' + leg.role)"></span>
                      <span class="simbrief-icao" x-text="leg.icao"></span>
                      <span class="simbrief-status" :class="'status-' + leg.status" x-text="$store.app.t('simbrief_status_' + leg.status)"></span>
                      <span class="gsx-tag gsx-match" x-show="leg.gsx_status === 'installed_match'"
                            :title="$store.app.t('scenery_gsx_match_tt')">GSX</span>
                      <span class="gsx-tag gsx-unmatched" x-show="leg.gsx_status === 'installed_unmatched'"
                            :title="$store.app.t('scenery_gsx_unmatched_tt')">GSX</span>
                      <button type="button" class="gsx-tag gsx-missing" x-show="leg.gsx_status === 'missing'"
                              @click.stop.prevent="openGsxSearch(leg.icao)"
                              :title="$store.app.t('scenery_gsx_missing_tt')">GSX</button>
                      <button class="btn" x-show="leg.status === 'disabled'" :disabled="applying" @click="quickEnable(leg.folder_name)" x-text="$store.app.t('simbrief_enable_btn')"></button>
                    </div>
                  </template>
                </div>
              </template>
            </div>

            <p class="hint" x-show="statusText" x-text="statusText"></p>
            <div class="progress-track" x-show="applying">
              <div class="progress-fill" :style="`width: ${progressFraction * 100}%`"></div>
            </div>

            <template x-if="dataLoaded && allRecords.length === 0">
              <p class="placeholder-note">&mdash;</p>
            </template>

            <div class="scenery-map-view" x-show="mapView">
              <p class="hint" x-text="$store.app.t('scenery_map_hint', mapMarkers.length, allRecords.length)"></p>
              <div class="scenery-map-container" x-ref="mapContainer"></div>
            </div>

            <div class="scenery-search" x-show="!mapView">
              <input type="text" class="scenery-search-input" x-model="searchQuery"
                     :placeholder="$store.app.t('scenery_search_placeholder')" />
              <button class="btn icon-btn" x-show="searchQuery" @click="searchQuery = ''"
                      :title="$store.app.t('scenery_search_clear')">✕</button>
            </div>

            <button type="button" class="btn gsx-folder-link" x-show="!mapView" @click="openGsxFolder()">📁 <span x-text="$store.app.t('gsx_open_folder_btn')"></span></button>

            <p class="placeholder-note" x-show="!mapView && searchQuery.trim() && visibleContinents.length === 0"
               x-text="$store.app.t('scenery_search_no_results')"></p>

            <div class="scenery-tree" x-show="!mapView" :class="{ 'is-busy': applying }">
              <template x-for="continentKey in visibleContinents" :key="continentKey">
                <div class="scenery-continent">
                  <div class="scenery-group-header">
                    <span class="group-swatch" :class="groupClass(byContinent[continentKey])"
                          :title="$store.app.t('scenery_group_toggle_tt')"
                          @click="setGroup(byContinent[continentKey], !groupState(byContinent[continentKey]).allOn)">
                      <span x-show="groupState(byContinent[continentKey]).allOn">&#10003;</span>
                    </span>
                    <button class="scenery-toggle-btn" @click="toggleContinent(continentKey)">
                      <span x-text="expandedContinents[continentKey] ? '▼' : '▶'"></span>
                      <span x-text="$store.app.t('continent_' + continentKey)"></span>
                      <span class="hint" x-text="`(${groupState(byContinent[continentKey]).enabled}/${byContinent[continentKey].length})`"></span>
                    </button>
                  </div>

                  <template x-if="expandedContinents[continentKey]">
                    <div class="scenery-countries">
                      <template x-for="country in countriesFor(byContinent[continentKey])" :key="continentKey + '::' + country.name">
                        <div class="scenery-country">
                          <div class="scenery-group-header">
                            <span class="group-swatch" :class="groupClass(country.items)"
                                  :title="$store.app.t('scenery_group_toggle_tt')"
                                  @click="setGroup(country.items, !groupState(country.items).allOn)">
                              <span x-show="groupState(country.items).allOn">&#10003;</span>
                            </span>
                            <button class="scenery-toggle-btn country" @click="toggleCountry(continentKey + '::' + country.name)">
                              <span x-text="expandedCountries[continentKey + '::' + country.name] ? '▼' : '▶'"></span>
                              <span x-text="country.name"></span>
                              <span class="hint" x-text="`(${groupState(country.items).enabled}/${country.items.length})`"></span>
                            </button>
                          </div>

                          <template x-if="expandedCountries[continentKey + '::' + country.name]">
                            <div class="scenery-leaves">
                              <template x-for="record in country.items" :key="record.folder_name">
                                <label class="app-checkbox-row">
                                  <input type="checkbox" :checked="isEnabled(record)" @change="onToggle(record)" />
                                  <span class="scenery-item-text">
                                    <span class="scenery-name-row">
                                      <span class="scenery-name-truncate" x-text="record.display_name"></span>
                                      <span class="scenery-developer" x-show="record.developer" x-text="'(' + record.developer + ')'"></span>
                                      <span class="gsx-tag gsx-match" x-show="record.gsx_status === 'installed_match'"
                                            :title="$store.app.t('scenery_gsx_match_tt')">GSX</span>
                                      <span class="gsx-tag gsx-unmatched" x-show="record.gsx_status === 'installed_unmatched'"
                                            :title="$store.app.t('scenery_gsx_unmatched_tt')">GSX</span>
                                      <button type="button" class="gsx-tag gsx-missing" x-show="record.gsx_status === 'missing'"
                                              @click.stop.prevent="openGsxSearch(record.icao)"
                                              :title="$store.app.t('scenery_gsx_missing_tt')">GSX</button>
                                    </span>
                                    <span class="scenery-airport-name" x-show="record.airport_name" x-text="record.airport_name"></span>
                                  </span>
                                </label>
                              </template>
                            </div>
                          </template>
                        </div>
                      </template>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </div>
        </template>
      </section>

      <section x-show="$store.app.activeTab === 'aircraft'" x-data="aircraftTab">
        <h2 x-text="$store.app.t('tab_aircraft').trim()"></h2>

        <template x-if="applying && !dataLoaded">
          <div>
            <p class="placeholder-note" x-text="$store.app.t('addon_apply_busy')"></p>
            <p class="hint" x-show="statusText" x-text="statusText"></p>
            <div class="progress-track">
              <div class="progress-fill" :style="`width: ${progressFraction * 100}%`"></div>
            </div>
          </div>
        </template>

        <template x-if="(!applying || dataLoaded) && noCommunity">
          <p class="placeholder-note" x-text="$store.app.t('scenery_no_community')"></p>
        </template>

        <template x-if="(!applying || dataLoaded) && !noCommunity">
          <div>
            <p class="warning-text" x-text="$store.app.t('aircraft_experimental_notice')"></p>

            <div class="toolbar">
              <button class="btn" :disabled="applying" @click="setAll(true)" x-text="$store.app.t('scenery_select_all_on')"></button>
              <button class="btn" :disabled="applying" @click="setAll(false)" x-text="$store.app.t('scenery_select_all_off')"></button>
              <button class="btn" :disabled="applying" @click="refresh()" x-text="$store.app.t('scenery_refresh_btn')"></button>
              <button class="btn primary" :disabled="applying" @click="apply()" x-text="$store.app.t('scenery_apply_btn')"></button>
            </div>

            <p class="hint" x-text="$store.app.t('scenery_apply_pending_hint')"></p>
            <p class="hint" x-text="$store.app.t('aircraft_grouping_hint')"></p>
            <p class="hint" x-show="statusText" x-text="statusText"></p>
            <div class="progress-track" x-show="applying">
              <div class="progress-fill" :style="`width: ${progressFraction * 100}%`"></div>
            </div>

            <template x-if="dataLoaded && allRecords.length === 0">
              <p class="placeholder-note">&mdash;</p>
            </template>

            <div class="scenery-search">
              <input type="text" class="scenery-search-input" x-model="searchQuery"
                     :placeholder="$store.app.t('aircraft_search_placeholder')" />
              <button class="btn icon-btn" x-show="searchQuery" @click="searchQuery = ''"
                      :title="$store.app.t('scenery_search_clear')">✕</button>
            </div>

            <p class="placeholder-note" x-show="searchQuery.trim() && developers.length === 0"
               x-text="$store.app.t('aircraft_search_no_results')"></p>

            <div class="scenery-tree" :class="{ 'is-busy': applying }">
              <template x-for="developer in developers" :key="developer">
                <div class="scenery-continent">
                  <button class="scenery-toggle-btn" @click="toggleDeveloper(developer)">
                    <span x-text="expandedDevelopers[developer] ? '▼' : '▶'"></span>
                    <span x-text="developer"></span>
                    <span class="hint" x-text="`(${developerTotal(developer)})`"></span>
                  </button>

                  <template x-if="expandedDevelopers[developer]">
                    <div class="scenery-countries">
                      <template x-if="grouped.byDeveloper[developer].aircraft.length">
                        <div>
                          <button class="scenery-toggle-btn country" @click="toggleSection(developer + '::aircraft')">
                            <span x-text="expandedSections[developer + '::aircraft'] ? '▼' : '▶'"></span>
                            <span x-text="$store.app.t('aircraft_section_aircraft')"></span>
                            <span class="hint" x-text="`(${grouped.byDeveloper[developer].aircraft.length})`"></span>
                          </button>

                          <template x-if="expandedSections[developer + '::aircraft']">
                            <div class="scenery-leaves">
                              <template x-for="record in sortedByName(grouped.byDeveloper[developer].aircraft)" :key="record.folder_name">
                                <div>
                                  <div class="addon-row-line">
                                    <label class="app-checkbox-row">
                                      <input type="checkbox" :checked="isEnabled(record)" @change="onToggleAircraft(record)" />
                                      <span x-text="record.display_name"></span>
                                      <span class="type-tag" x-show="record.type_hint" x-text="record.type_hint"></span>
                                      <span class="suspect-badge" x-show="record.suspected_livery" title="⚠️">⚠️</span>
                                    </label>
                                    <button class="btn icon-btn" @click="toggleOverrideEditor(record.folder_name)" :title="$store.app.t('aircraft_override_btn')">⚙</button>
                                  </div>

                                  <template x-if="record.suspected_livery">
                                    <div class="livery-suggestion">
                                      <span x-text="$store.app.t('aircraft_suspected_livery_hint')"></span>
                                      <div class="livery-suggestion-actions">
                                        <button class="btn" @click="approveLiverySuggestion(record)" x-text="$store.app.t('aircraft_suspected_livery_approve')"></button>
                                        <button class="btn" @click="toggleOverrideEditor(record.folder_name)" x-text="$store.app.t('aircraft_suspected_livery_manual')"></button>
                                        <button class="btn icon-btn" @click="dismissLiverySuggestion(record)" :title="$store.app.t('aircraft_suspected_livery_ignore')">✕</button>
                                      </div>
                                    </div>
                                  </template>

                                  <template x-if="isOverrideOpen(record.folder_name)">
                                    <div class="override-editor">
                                      <div class="override-field">
                                        <label x-text="$store.app.t('aircraft_override_type_label')"></label>
                                        <select @change="setTypeOverride(record, $event.target.value)">
                                          <option value="auto" :selected="effectiveTypeOverride(record.folder_name) === 'auto'" x-text="$store.app.t('aircraft_override_type_auto')"></option>
                                          <option value="aircraft" :selected="effectiveTypeOverride(record.folder_name) === 'aircraft'" x-text="$store.app.t('aircraft_override_type_aircraft')"></option>
                                          <option value="livery" :selected="effectiveTypeOverride(record.folder_name) === 'livery'" x-text="$store.app.t('aircraft_override_type_livery')"></option>
                                        </select>
                                      </div>
                                    </div>
                                  </template>

                                  <template x-if="liveriesFor(record.folder_name).length">
                                    <button class="scenery-toggle-btn country nested-livery-toggle" @click="toggleLiveries(record.folder_name)">
                                      <span x-text="expandedLiveries[record.folder_name] ? '▼' : '▶'"></span>
                                      <span x-text="$store.app.t('aircraft_liveries_toggle')"></span>
                                      <span class="hint" x-text="`(${liveriesFor(record.folder_name).length})`"></span>
                                    </button>
                                  </template>

                                  <template x-if="expandedLiveries[record.folder_name]">
                                    <template x-for="livery in liveriesFor(record.folder_name)" :key="livery.folder_name">
                                      <div class="livery-row">
                                        <div class="addon-row-line">
                                          <label class="app-checkbox-row">
                                            <input type="checkbox" :checked="isEnabled(livery)" @change="onToggleLivery(livery)" />
                                            <span x-text="livery.display_name"></span>
                                          </label>
                                          <button class="btn icon-btn" @click="toggleOverrideEditor(livery.folder_name)" :title="$store.app.t('aircraft_override_btn')">⚙</button>
                                        </div>
                                        <template x-if="isOverrideOpen(livery.folder_name)">
                                          <div class="override-editor">
                                            <div class="override-field">
                                              <label x-text="$store.app.t('aircraft_override_type_label')"></label>
                                              <select @change="setTypeOverride(livery, $event.target.value)">
                                                <option value="auto" :selected="effectiveTypeOverride(livery.folder_name) === 'auto'" x-text="$store.app.t('aircraft_override_type_auto')"></option>
                                                <option value="aircraft" :selected="effectiveTypeOverride(livery.folder_name) === 'aircraft'" x-text="$store.app.t('aircraft_override_type_aircraft')"></option>
                                                <option value="livery" :selected="effectiveTypeOverride(livery.folder_name) === 'livery'" x-text="$store.app.t('aircraft_override_type_livery')"></option>
                                              </select>
                                            </div>
                                            <div class="override-field">
                                              <label x-text="$store.app.t('aircraft_override_parent_label')"></label>
                                              <select @change="setParentOverride(livery, $event.target.value)">
                                                <option value="auto" :selected="effectiveParentOverride(livery.folder_name) === 'auto'" x-text="$store.app.t('aircraft_override_parent_auto')"></option>
                                                <option value="" :selected="effectiveParentOverride(livery.folder_name) === ''" x-text="$store.app.t('aircraft_override_parent_none')"></option>
                                                <template x-for="opt in sortedByName(aircraftRecords)" :key="opt.folder_name">
                                                  <option :value="opt.folder_name" :selected="effectiveParentOverride(livery.folder_name) === opt.folder_name" x-text="opt.display_name"></option>
                                                </template>
                                              </select>
                                            </div>
                                          </div>
                                        </template>
                                      </div>
                                    </template>
                                  </template>
                                </div>
                              </template>
                            </div>
                          </template>
                        </div>
                      </template>

                      <template x-if="grouped.byDeveloper[developer].unassignedLiveries.length">
                        <div>
                          <button class="scenery-toggle-btn country" @click="toggleSection(developer + '::liveries')">
                            <span x-text="expandedSections[developer + '::liveries'] ? '▼' : '▶'"></span>
                            <span x-text="$store.app.t('aircraft_section_liveries')"></span>
                            <span class="hint" x-text="`(${grouped.byDeveloper[developer].unassignedLiveries.length})`"></span>
                          </button>

                          <template x-if="expandedSections[developer + '::liveries']">
                            <div class="scenery-leaves">
                              <template x-for="record in sortedByName(grouped.byDeveloper[developer].unassignedLiveries)" :key="record.folder_name">
                                <div>
                                  <div class="addon-row-line">
                                    <label class="app-checkbox-row">
                                      <input type="checkbox" :checked="isEnabled(record)" @change="onToggleLivery(record)" />
                                      <span x-text="record.display_name"></span>
                                    </label>
                                    <button class="btn icon-btn" @click="toggleOverrideEditor(record.folder_name)" :title="$store.app.t('aircraft_override_btn')">⚙</button>
                                  </div>
                                  <template x-if="isOverrideOpen(record.folder_name)">
                                    <div class="override-editor">
                                      <div class="override-field">
                                        <label x-text="$store.app.t('aircraft_override_type_label')"></label>
                                        <select @change="setTypeOverride(record, $event.target.value)">
                                          <option value="auto" :selected="effectiveTypeOverride(record.folder_name) === 'auto'" x-text="$store.app.t('aircraft_override_type_auto')"></option>
                                          <option value="aircraft" :selected="effectiveTypeOverride(record.folder_name) === 'aircraft'" x-text="$store.app.t('aircraft_override_type_aircraft')"></option>
                                          <option value="livery" :selected="effectiveTypeOverride(record.folder_name) === 'livery'" x-text="$store.app.t('aircraft_override_type_livery')"></option>
                                        </select>
                                      </div>
                                      <div class="override-field">
                                        <label x-text="$store.app.t('aircraft_override_parent_label')"></label>
                                        <select @change="setParentOverride(record, $event.target.value)">
                                          <option value="auto" :selected="effectiveParentOverride(record.folder_name) === 'auto'" x-text="$store.app.t('aircraft_override_parent_auto')"></option>
                                          <option value="" :selected="effectiveParentOverride(record.folder_name) === ''" x-text="$store.app.t('aircraft_override_parent_none')"></option>
                                          <template x-for="opt in sortedByName(aircraftRecords)" :key="opt.folder_name">
                                            <option :value="opt.folder_name" :selected="effectiveParentOverride(record.folder_name) === opt.folder_name" x-text="opt.display_name"></option>
                                          </template>
                                        </select>
                                      </div>
                                    </div>
                                  </template>
                                </div>
                              </template>
                            </div>
                          </template>
                        </div>
                      </template>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </div>
        </template>
      </section>

      <section x-show="$store.app.activeTab === 'settings'" x-data="settingsTab">
        <h2 x-text="$store.app.t('tab_set').trim()"></h2>

        <div class="field-row">
          <label x-text="$store.app.t('lang_label')"></label>
          <select @change="$store.app.setLanguage($event.target.value)">
            <template x-for="lang in languages" :key="lang.code">
              <option :value="lang.code" :selected="lang.code === $store.app.language" x-text="lang.label"></option>
            </template>
          </select>
          <p class="hint" x-show="$store.app.language !== 'CZ' && $store.app.language !== 'EN'" x-text="$store.app.t('lang_ai_notice')"></p>
        </div>

        <div class="field-row">
          <label x-text="$store.app.t('theme_label')"></label>
          <div class="theme-choice-row">
            <button class="btn" :class="{ active: $store.app.theme === 'dark' }" @click="$store.app.setTheme('dark')" x-text="$store.app.t('theme_dark')"></button>
            <button class="btn" :class="{ active: $store.app.theme === 'light' }" @click="$store.app.setTheme('light')" x-text="$store.app.t('theme_light')"></button>
            <button class="btn" :class="{ active: $store.app.theme === 'system' }" @click="$store.app.setTheme('system')" x-text="$store.app.t('theme_system')"></button>
          </div>
        </div>

        <div class="field-row">
          <label x-text="`${$store.app.t('ui_scale_label')} ${$store.app.uiScale}%`"></label>
          <input
            type="range"
            min="70"
            max="150"
            step="5"
            :value="$store.app.uiScale"
            @input="$store.app.previewUiScale(Number($event.target.value))"
            @change="$store.app.setUiScale(Number($event.target.value))"
          />
        </div>

        <div class="field-row">
          <label x-text="$store.app.t('sim_label')"></label>
          <div class="theme-choice-row">
            <select @change="saveSimVersion($event.target.value)">
              <option value="MSFS 2020" :selected="simVersion === 'MSFS 2020'">MSFS 2020</option>
              <option value="MSFS 2024" :selected="simVersion === 'MSFS 2024'">MSFS 2024</option>
            </select>
            <select @change="saveSimPlatform($event.target.value)">
              <option value="Steam" :selected="simPlatform === 'Steam'">Steam</option>
              <option value="MS Store" :selected="simPlatform === 'MS Store'">MS Store</option>
            </select>
          </div>
        </div>

        <h3 x-text="$store.app.t('exe_xml_path_title')"></h3>
        <p class="hint" x-text="$store.app.t('exe_xml_path_hint')"></p>
        <div class="path-row">
          <input type="text" readonly :value="exeXmlPath" :placeholder="$store.app.t('exe_xml_path_placeholder')" />
          <button class="btn" @click="browseExeXmlPath()" x-text="$store.app.t('btn_browse')"></button>
          <button class="btn" @click="resetExeXmlPath()" x-text="$store.app.t('exe_xml_path_reset_btn')"></button>
        </div>

        <div class="field-row">
          <label x-text="$store.app.t('post_launch_label')"></label>
          <select @change="savePostLaunch($event.target.value)">
            <option value="exit" :selected="postLaunch === 'exit'" x-text="$store.app.t('post_launch_exit')"></option>
            <option value="stay_and_watch" :selected="postLaunch === 'stay_and_watch'" x-text="$store.app.t('post_launch_watch')"></option>
          </select>
        </div>

        <hr />

        <h3 x-text="$store.app.t('set_nav_title')"></h3>
        <p class="hint" x-text="$store.app.t('set_nav_hint')"></p>
        <div class="path-row">
          <input type="text" readonly :value="communityPath" :placeholder="$store.app.t('set_nav_placeholder')" />
          <button class="btn" @click="browseCommunity()" x-text="$store.app.t('btn_browse')"></button>
        </div>
        <button type="button" class="btn detected-path-btn" x-show="communityPathSuggestion" x-cloak
                @click="useDetectedCommunityPath()"
                x-text="$store.app.t('community_path_detected', communityPathSuggestion)"></button>

        <button type="button" class="btn" :disabled="!communityPath || folderUsageScanning.community"
                @click="scanCommunityUsage()"
                x-text="folderUsageScanning.community ? $store.app.t('folder_usage_scanning') : $store.app.t('community_usage_btn')"></button>

        <div class="community-usage" x-show="folderUsage.community" x-cloak>
          <div class="community-usage-head">
            <p class="hint" x-text="$store.app.t('folder_usage_total', formatBytes(folderUsage.community ? folderUsage.community.total_bytes : 0))"></p>
            <button type="button" class="btn icon-btn" @click="closeUsage('community')" :title="$store.app.t('usage_close')">✕</button>
          </div>
          <template x-for="pkg in topPackages('community')" :key="pkg.folder_name">
            <div class="community-usage-row">
              <span class="community-usage-name" x-text="pkg.folder_name"></span>
              <span class="community-usage-size" x-text="formatBytes(pkg.bytes)"></span>
            </div>
          </template>
        </div>

        <h3 x-text="$store.app.t('disabled_path_title')"></h3>
        <p class="hint" x-text="$store.app.t('disabled_path_hint')"></p>
        <div class="path-row">
          <input type="text" readonly :value="disabledPath" :placeholder="$store.app.t('disabled_path_placeholder')" />
          <button class="btn" @click="browseDisabledPath()" x-text="$store.app.t('btn_browse')"></button>
          <button class="btn" @click="resetDisabledPath()" x-text="$store.app.t('disabled_path_reset_btn')"></button>
        </div>

        <button type="button" class="btn" :disabled="!communityPath || folderUsageScanning.disabled"
                @click="scanDisabledUsage()"
                x-text="folderUsageScanning.disabled ? $store.app.t('folder_usage_scanning') : $store.app.t('disabled_usage_btn')"></button>

        <div class="community-usage" x-show="folderUsage.disabled" x-cloak>
          <div class="community-usage-head">
            <p class="hint" x-text="$store.app.t('folder_usage_total', formatBytes(folderUsage.disabled ? folderUsage.disabled.total_bytes : 0))"></p>
            <button type="button" class="btn icon-btn" @click="closeUsage('disabled')" :title="$store.app.t('usage_close')">✕</button>
          </div>
          <template x-for="pkg in topPackages('disabled')" :key="pkg.folder_name">
            <div class="community-usage-row">
              <span class="community-usage-name" x-text="pkg.folder_name"></span>
              <span class="community-usage-size" x-text="formatBytes(pkg.bytes)"></span>
            </div>
          </template>
        </div>

        <button type="button" class="btn" :disabled="!communityPath || diagnosticsScanning"
                @click="scanCommunityDiagnostics()"
                x-text="diagnosticsScanning ? $store.app.t('folder_usage_scanning') : $store.app.t('diagnostics_btn')"></button>

        <div class="community-usage" x-show="diagnostics" x-cloak>
          <div class="community-usage-head">
            <p class="hint" x-text="diagnosticsHasIssues ? $store.app.t('diagnostics_issues_found') : $store.app.t('diagnostics_none_found')"></p>
            <button type="button" class="btn icon-btn" @click="closeDiagnostics()" :title="$store.app.t('usage_close')">✕</button>
          </div>

          <template x-if="diagnostics && diagnostics.misplaced.length > 0">
            <div>
              <p class="hint" x-text="$store.app.t('diagnostics_misplaced_hint')"></p>
              <template x-for="item in (diagnostics ? diagnostics.misplaced : [])" :key="item.folder_name">
                <div class="community-usage-row">
                  <span class="community-usage-name" x-text="item.folder_name + ' / ' + item.nested_folder"></span>
                </div>
              </template>
            </div>
          </template>

          <template x-if="diagnostics && diagnostics.duplicates.length > 0">
            <div>
              <p class="hint" x-text="$store.app.t('diagnostics_duplicates_hint')"></p>
              <p class="hint diagnostics-caveat" x-text="$store.app.t('diagnostics_duplicates_caveat')"></p>
              <template x-for="item in (diagnostics ? diagnostics.duplicates : [])" :key="item.title">
                <div class="community-usage-row">
                  <span class="community-usage-name" x-text="item.title + ': ' + item.folders.join(', ')"></span>
                </div>
              </template>
            </div>
          </template>
        </div>

        <h3 x-text="$store.app.t('simbrief_username_label')"></h3>
        <p class="hint" x-text="$store.app.t('simbrief_username_hint')"></p>
        <div class="field-row">
          <input type="text" :value="simbriefUsername" @change="saveSimbriefUsername($event.target.value)" placeholder="Navigraph Alias / SimBrief username" />
        </div>

        <h3 x-text="$store.app.t('gsx_path_title')"></h3>
        <p class="hint" x-text="$store.app.t('gsx_path_hint')"></p>
        <div class="path-row">
          <input type="text" readonly :value="gsxPath" :placeholder="$store.app.t('gsx_path_placeholder')" />
          <button class="btn" @click="browseGsxPath()" x-text="$store.app.t('btn_browse')"></button>
          <button class="btn" @click="resetGsxPath()" x-text="$store.app.t('gsx_path_reset_btn')"></button>
        </div>

        <hr />

        <h3 x-text="$store.app.t('set_add_title')"></h3>
        <div class="field-row">
          <input type="text" x-model="form.name" :placeholder="$store.app.t('add_name_placeholder')" />
        </div>
        <div class="path-row">
          <input type="text" x-model="form.path" :placeholder="$store.app.t('add_path_placeholder')" />
          <button class="btn" @click="browseAppPath()" x-text="$store.app.t('btn_browse')"></button>
        </div>
        <div class="field-row inline">
          <label x-text="$store.app.t('mode_label')"></label>
          <select x-model="form.launchMode">
            <option value="immediate" x-text="$store.app.t('mode_immediate')"></option>
            <option value="timer" x-text="$store.app.t('mode_timer')"></option>
            <option value="smart" x-text="$store.app.t('mode_smart')"></option>
          </select>
          <template x-if="form.launchMode === 'timer'">
            <span class="inline-delay">
              <input type="number" min="1" x-model.number="form.delay" style="width:60px" />
              <span x-text="$store.app.t('delay_label')"></span>
            </span>
          </template>
        </div>
        <div class="field-row inline">
          <label><input type="checkbox" x-model="form.admin" /> <span x-text="$store.app.t('run_admin_label')"></span></label>
        </div>
        <p class="error-text" x-show="errorKey" x-text="$store.app.t(errorKey)"></p>
        <button class="btn primary" @click="submitApp()" x-text="form.previousName ? $store.app.t('btn_save_edit') : $store.app.t('btn_add')"></button>

        <h3 x-text="$store.app.t('set_manage_title')"></h3>
        <div class="app-list">
          <template x-for="[name, data] in appEntries" :key="name">
            <div class="app-row">
              <span class="app-row-label" x-text="appRowLabel(name, data)"></span>
              <span class="app-row-actions">
                <button class="btn" @click="moveApp(name, 'up')" title="up">▲</button>
                <button class="btn" @click="moveApp(name, 'down')" title="down">▼</button>
                <button class="btn" @click="openFolder(data.path)" title="folder">📁</button>
                <button class="btn" @click="startEdit(name)" x-text="$store.app.t('btn_edit')"></button>
                <button class="btn danger" @click="removeApp(name)" x-text="$store.app.t('btn_remove')"></button>
              </span>
            </div>
          </template>
        </div>

        <p class="version-footer" x-text="`FlightOps Hub ${$store.app.version}`"></p>

        <div class="update-notice-wrap" x-show="$store.app.updateInfo" x-cloak>
          <button type="button" class="update-notice-toggle" @click="$store.app.updateNotesOpen = !$store.app.updateNotesOpen">
            <span x-text="$store.app.t('update_available', $store.app.updateInfo ? $store.app.updateInfo.version : '')"></span>
            <span x-text="$store.app.updateNotesOpen ? '▲' : '▼'"></span>
          </button>
          <div class="update-notes" x-show="$store.app.updateNotesOpen" x-cloak>
            <pre x-text="$store.app.updateInfo ? $store.app.updateInfo.notes : ''"></pre>
            <div class="update-actions">
              <button type="button" class="btn primary" :disabled="$store.app.updateDownloading"
                      x-show="$store.app.updateInfo && $store.app.updateInfo.download_url"
                      @click="$store.app.downloadUpdate()"
                      x-text="$store.app.updateDownloading ? $store.app.t('update_downloading') : $store.app.t('update_download_btn')"></button>
              <button type="button" class="btn" @click="$store.app.openUpdatePage()" x-text="$store.app.t('update_open_btn')"></button>
            </div>
            <div class="progress-track" x-show="$store.app.updateDownloading && $store.app.updateDownloadPercent != null">
              <div class="progress-fill" :style="`width: ${$store.app.updateDownloadPercent}%`"></div>
            </div>
            <p class="error-text" x-show="$store.app.updateDownloadError" x-text="$store.app.t('update_download_error', $store.app.updateDownloadError)"></p>
          </div>
        </div>
      </section>
    </div>

    <div class="modal-backdrop" x-show="$store.modal.visible" x-cloak>
      <div class="modal-box">
        <h3 x-text="$store.modal.title"></h3>
        <p x-text="$store.modal.message"></p>
        <input type="text" x-show="$store.modal.kind === 'prompt'" x-model="$store.modal.value" @keydown.enter="$store.modal.confirm()" />
        <div class="actions">
          <button class="btn" x-show="$store.modal.kind !== 'alert'" @click="$store.modal.cancel()" x-text="$store.app.t('modal_cancel')"></button>
          <button class="btn primary" @click="$store.modal.confirm()" x-text="$store.app.t('modal_ok')"></button>
        </div>
      </div>
    </div>
  </div>

  <script src="vendor/leaflet.js"></script>
  <script src="js/events.js"></script>
  <script src="js/api.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/state.js"></script>
  <script src="js/tabs/flight.js"></script>
  <script src="js/tabs/autostart.js"></script>
  <script src="js/tabs/scenery.js"></script>
  <script src="js/tabs/aircraft.js"></script>
  <script src="js/tabs/settings.js"></script>
  <script src="vendor/alpine.min.js" defer></script>
</body>
</html>
