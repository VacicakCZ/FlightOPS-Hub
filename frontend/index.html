<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FlightOps Hub</title>
  <link rel="stylesheet" href="css/base.css" />
</head>
<body>
  <div id="app" x-data x-init="window.AppReady = $store.app.init()">
    <nav class="tab-bar">
      <button :class="{ active: $store.app.activeTab === 'flight' }" @click="$store.app.setTab('flight')">
        <span class="tab-main" x-text="$store.app.tMain('tab_let')"></span>
        <span class="tab-sub" x-show="$store.app.tParen('tab_let')" x-text="$store.app.tParen('tab_let')"></span>
      </button>
      <button :class="{ active: $store.app.activeTab === 'autostart' }" @click="$store.app.setTab('autostart')">
        <span class="tab-main" x-text="$store.app.tMain('tab_exe')"></span>
        <span class="tab-sub" x-show="$store.app.tParen('tab_exe')" x-text="$store.app.tParen('tab_exe')"></span>
      </button>
      <button :class="{ active: $store.app.activeTab === 'scenery' }" @click="$store.app.setTab('scenery')">
        <span class="tab-main" x-text="$store.app.tMain('tab_scenery')"></span>
        <span class="tab-sub" x-show="$store.app.tParen('tab_scenery')" x-text="$store.app.tParen('tab_scenery')"></span>
      </button>
      <button :class="{ active: $store.app.activeTab === 'aircraft' }" @click="$store.app.setTab('aircraft')">
        <span class="tab-main" x-text="$store.app.tMain('tab_aircraft')"></span>
        <span class="tab-sub" x-show="$store.app.tParen('tab_aircraft')" x-text="$store.app.tParen('tab_aircraft')"></span>
      </button>
      <button :class="{ active: $store.app.activeTab === 'settings' }" @click="$store.app.setTab('settings')">
        <span class="tab-main" x-text="$store.app.tMain('tab_set')"></span>
        <span class="tab-sub" x-show="$store.app.tParen('tab_set')" x-text="$store.app.tParen('tab_set')"></span>
      </button>
    </nav>

    <div class="tab-panels">
      <section x-show="$store.app.activeTab === 'flight'" x-data="flightTab">
        <h2 x-text="$store.app.t('main_title')"></h2>

        <div class="field-row inline">
          <label x-text="$store.app.t('profile_label')"></label>
          <select @change="onProfileChange($event.target.value)">
            <option value="" :selected="!profileName" x-text="$store.app.t('default_profile')"></option>
            <template x-for="name in profileNames" :key="name">
              <option :value="name" :selected="name === profileName" x-text="name"></option>
            </template>
          </select>
          <button class="btn" @click="updateProfile()" :disabled="!profileName" :title="$store.app.t('tt_update')" x-text="updateJustSaved ? '✓' : '🔄'"></button>
          <button class="btn" @click="saveProfileAs()" :title="$store.app.t('tt_add')">➕</button>
          <button class="btn" @click="deleteProfile()" :disabled="!profileName" :title="$store.app.t('tt_delete')">🗑</button>
        </div>

        <p class="airac-status" :class="airacStatusClass" x-text="airacStatusText"></p>

        <div class="app-checklist">
          <template x-for="name in appNames" :key="name">
            <label class="app-checkbox-row">
              <input type="checkbox" x-model="checked[name]" />
              <span x-text="name"></span>
            </label>
          </template>
        </div>

        <button class="btn primary btn-launch" :disabled="launching" @click="launchAll()" x-text="$store.app.t('btn_launch')"></button>
      </section>

      <section x-show="$store.app.activeTab === 'autostart'" x-data="autostartTab">
        <h2 x-text="$store.app.t('exe_title')"></h2>

        <div class="field-row inline">
          <label x-text="$store.app.t('exe_profile_label')"></label>
          <select @change="onProfileChange($event.target.value)">
            <option value="" :selected="!profileName" x-text="$store.app.t('default_profile')"></option>
            <template x-for="name in profileNames" :key="name">
              <option :value="name" :selected="name === profileName" x-text="name"></option>
            </template>
          </select>
          <button class="btn" @click="updateProfile()" :disabled="!profileName" :title="$store.app.t('tt_update')" x-text="updateJustSaved ? '✓' : '🔄'"></button>
          <button class="btn" @click="saveProfileAs()" :title="$store.app.t('tt_add')">➕</button>
          <button class="btn" @click="deleteProfile()" :disabled="!profileName" :title="$store.app.t('tt_delete')">🗑</button>
        </div>

        <p class="hint" x-text="path"></p>
        <p class="hint" x-text="$store.app.t('exe_rename_hint')"></p>

        <template x-if="!exists">
          <p class="error-text" x-text="$store.app.t('exe_not_found')"></p>
        </template>

        <template x-if="exists && error">
          <p class="error-text" x-text="`${$store.app.t('exe_error')} ${error}`"></p>
        </template>

        <template x-if="exists && !error">
          <div class="app-checklist">
            <template x-for="addon in addons" :key="addon.unique_key">
              <div class="exe-row">
                <label class="exe-row-label">
                  <input type="checkbox" :checked="addon.enabled" @change="toggle(addon)" />
                  <span x-text="addon.display_name"></span>
                </label>
                <button class="btn" @click="rename(addon)" :title="$store.app.t('exe_rename_tt')">✏️</button>
              </div>
            </template>
          </div>
        </template>
      </section>

      <section x-show="$store.app.activeTab === 'scenery'">
        <h2 x-text="$store.app.t('tab_scenery').trim()"></h2>
        <p class="placeholder-note">Bude implementováno v milníku M4.</p>
      </section>

      <section x-show="$store.app.activeTab === 'aircraft'">
        <h2 x-text="$store.app.t('tab_aircraft').trim()"></h2>
        <p class="placeholder-note">Bude implementováno v milníku M5.</p>
      </section>

      <section x-show="$store.app.activeTab === 'settings'" x-data="settingsTab">
        <h2 x-text="$store.app.t('tab_set').trim()"></h2>

        <div class="field-row">
          <label x-text="$store.app.t('lang_label')"></label>
          <select @change="$store.app.setLanguage($event.target.value)">
            <template x-for="lang in languages" :key="lang.code">
              <option :value="lang.code" :selected="lang.code === $store.app.language" x-text="lang.label"></option>
            </template>
          </select>
        </div>

        <div class="field-row">
          <label x-text="$store.app.t('theme_label')"></label>
          <div class="theme-choice-row">
            <button class="btn" :class="{ active: $store.app.theme === 'dark' }" @click="$store.app.setTheme('dark')" x-text="$store.app.t('theme_dark')"></button>
            <button class="btn" :class="{ active: $store.app.theme === 'light' }" @click="$store.app.setTheme('light')" x-text="$store.app.t('theme_light')"></button>
            <button class="btn" :class="{ active: $store.app.theme === 'system' }" @click="$store.app.setTheme('system')" x-text="$store.app.t('theme_system')"></button>
          </div>
        </div>

        <div class="field-row">
          <label x-text="`${$store.app.t('ui_scale_label')} ${$store.app.uiScale}%`"></label>
          <input
            type="range"
            min="70"
            max="150"
            step="5"
            :value="$store.app.uiScale"
            @input="$store.app.previewUiScale(Number($event.target.value))"
            @change="$store.app.setUiScale(Number($event.target.value))"
          />
        </div>

        <div class="field-row">
          <label x-text="$store.app.t('sim_label')"></label>
          <div class="theme-choice-row">
            <select @change="saveSimVersion($event.target.value)">
              <option value="MSFS 2020" :selected="simVersion === 'MSFS 2020'">MSFS 2020</option>
              <option value="MSFS 2024" :selected="simVersion === 'MSFS 2024'">MSFS 2024</option>
            </select>
            <select @change="saveSimPlatform($event.target.value)">
              <option value="Steam" :selected="simPlatform === 'Steam'">Steam</option>
              <option value="MS Store" :selected="simPlatform === 'MS Store'">MS Store</option>
            </select>
          </div>
        </div>

        <div class="field-row">
          <label x-text="$store.app.t('post_launch_label')"></label>
          <select @change="savePostLaunch($event.target.value)">
            <option value="exit" :selected="postLaunch === 'exit'" x-text="$store.app.t('post_launch_exit')"></option>
            <option value="stay_and_watch" :selected="postLaunch === 'stay_and_watch'" x-text="$store.app.t('post_launch_watch')"></option>
          </select>
        </div>

        <hr />

        <h3 x-text="$store.app.t('set_nav_title')"></h3>
        <p class="hint" x-text="$store.app.t('set_nav_hint')"></p>
        <div class="path-row">
          <input type="text" readonly :value="communityPath" :placeholder="$store.app.t('set_nav_placeholder')" />
          <button class="btn" @click="browseCommunity()" x-text="$store.app.t('btn_browse')"></button>
        </div>

        <h3 x-text="$store.app.t('disabled_path_title')"></h3>
        <p class="hint" x-text="$store.app.t('disabled_path_hint')"></p>
        <div class="path-row">
          <input type="text" readonly :value="disabledPath" :placeholder="$store.app.t('disabled_path_placeholder')" />
          <button class="btn" @click="browseDisabledPath()" x-text="$store.app.t('btn_browse')"></button>
          <button class="btn" @click="resetDisabledPath()" x-text="$store.app.t('disabled_path_reset_btn')"></button>
        </div>

        <hr />

        <h3 x-text="$store.app.t('set_add_title')"></h3>
        <div class="field-row">
          <input type="text" x-model="form.name" :placeholder="$store.app.t('add_name_placeholder')" />
        </div>
        <div class="path-row">
          <input type="text" x-model="form.path" :placeholder="$store.app.t('add_path_placeholder')" />
          <button class="btn" @click="browseAppPath()" x-text="$store.app.t('btn_browse')"></button>
        </div>
        <div class="field-row inline">
          <label x-text="$store.app.t('mode_label')"></label>
          <select x-model="form.launchMode">
            <option value="immediate" x-text="$store.app.t('mode_immediate')"></option>
            <option value="timer" x-text="$store.app.t('mode_timer')"></option>
            <option value="smart" x-text="$store.app.t('mode_smart')"></option>
          </select>
          <template x-if="form.launchMode === 'timer'">
            <span class="inline-delay">
              <input type="number" min="1" x-model.number="form.delay" style="width:60px" />
              <span x-text="$store.app.t('delay_label')"></span>
            </span>
          </template>
        </div>
        <div class="field-row inline">
          <label><input type="checkbox" x-model="form.admin" /> <span x-text="$store.app.t('run_admin_label')"></span></label>
        </div>
        <p class="error-text" x-show="errorKey" x-text="$store.app.t(errorKey)"></p>
        <button class="btn primary" @click="submitApp()" x-text="form.previousName ? $store.app.t('btn_save_edit') : $store.app.t('btn_add')"></button>

        <h3 x-text="$store.app.t('set_manage_title')"></h3>
        <div class="app-list">
          <template x-for="[name, data] in appEntries" :key="name">
            <div class="app-row">
              <span class="app-row-label" x-text="appRowLabel(name, data)"></span>
              <span class="app-row-actions">
                <button class="btn" @click="moveApp(name, 'up')" title="up">▲</button>
                <button class="btn" @click="moveApp(name, 'down')" title="down">▼</button>
                <button class="btn" @click="openFolder(data.path)" title="folder">📁</button>
                <button class="btn" @click="startEdit(name)" x-text="$store.app.t('btn_edit')"></button>
                <button class="btn danger" @click="removeApp(name)" x-text="$store.app.t('btn_remove')"></button>
              </span>
            </div>
          </template>
        </div>

        <p class="version-footer" x-text="`FlightOps Hub ${$store.app.version}`"></p>
      </section>
    </div>

    <div class="modal-backdrop" x-show="$store.modal.visible" x-cloak>
      <div class="modal-box">
        <h3 x-text="$store.modal.title"></h3>
        <p x-text="$store.modal.message"></p>
        <input type="text" x-show="$store.modal.kind === 'prompt'" x-model="$store.modal.value" @keydown.enter="$store.modal.confirm()" />
        <div class="actions">
          <button class="btn" x-show="$store.modal.kind !== 'alert'" @click="$store.modal.cancel()">Zrušit</button>
          <button class="btn primary" @click="$store.modal.confirm()">OK</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/events.js"></script>
  <script src="js/api.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/state.js"></script>
  <script src="js/tabs/flight.js"></script>
  <script src="js/tabs/autostart.js"></script>
  <script src="js/tabs/settings.js"></script>
  <script src="vendor/alpine.min.js" defer></script>
</body>
</html>
